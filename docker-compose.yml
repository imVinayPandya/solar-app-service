version: '3.8'

services:
  app:
    build: .
    ports:
      - '3030:3030'
    environment:
      - NODE_ENV=development
      - DATABASE_URL=mongodb://mongo:27017/solar-applications
    env_file:
      - .env
    depends_on:
      - mongo
    restart: unless-stopped
    networks:
      - app-network

  mongo:
    image: mongo:5.0
    ports:
      - '27017:27017'
    volumes:
      - mongo-data:/data/db
    environment:
      - MONGO_INITDB_DATABASE=solar-applications
    networks:
      - app-network

  mongo-seed:
    build: .
    depends_on:
      - mongo
    command: npm run seed
    volumes:
      - ./setup/seed.json:/app/seed.json

networks:
  app-network:
    driver: bridge

volumes:
  mongo-data:
