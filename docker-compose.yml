version: '3.8'

services:
  app:
    build: .
    ports:
      - '3000:3000'
    environment:
      - NODE_ENV=production
    depends_on:
      - mongo
    restart: unless-stopped

  mongo:
    image: mongo:5.0
    ports:
      - '27017:27017'
    volumes:
      - mongo-data:/data/db
    environment:
      - MONGO_INITDB_DATABASE=solar-applications

  mongo-seed:
    build: .
    depends_on:
      - mongo
    command: npm run seed
    volumes:
      - ./setup/seed.json:/app/seed.json

volumes:
  mongo-data:
